services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: bingo
      POSTGRES_DB: bingo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bingo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingo -d bingo"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  bingo-db:

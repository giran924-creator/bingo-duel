services:
  - type: web
    name: bingo-duel
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run bot:setup && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bingo-duel-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEV_AUTH
        value: "false"
      - key: BOT_MODE
        value: webhook
      - key: TRUST_PROXY
        value: "1"
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: PRISMA_JS_SCHEMA_ENGINE
        value: "false"
databases:
  - name: bingo-duel-db
    plan: free
    databaseName: bingo
    user: bingo
    postgresMajorVersion: "16"
